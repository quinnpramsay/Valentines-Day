<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #FF6B9D;
            --black: #000000;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .content-box {
            padding: 3rem 2rem;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            color: var(--pink);
            margin-bottom: 3rem;
            font-weight: 400;
        }

        .media-container {
            margin: 2rem auto;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 500px;
        }

        .media-container img {
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
        }

        .message {
            font-size: 1.3rem;
            color: var(--pink);
            font-weight: 400;
            margin: 2rem 0;
        }

        .button-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 3rem;
            flex-wrap: wrap;
            position: relative;
            min-height: 60px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 0.8rem 2.5rem;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
        }

        .btn-yes {
            border-color: var(--pink);
            color: var(--pink);
        }

        .btn-yes:hover {
            background: var(--pink);
            color: var(--black);
        }

        .btn-no {
            border-color: var(--pink);
            color: var(--pink);
            font-size: 0.9rem;
            padding: 0.5rem 1.5rem;
            position: relative;
            transition: all 0.3s ease-out;
        }

        .btn-no:hover {
            background: var(--pink);
            color: var(--black);
        }

        .btn-no.evasive {
            position: absolute;
        }

        .btn-no.disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        /* Celebration styles */
        .celebration {
            display: none;
        }

        .celebration.active {
            display: block;
        }

        .celebration-message {
            font-size: 1.5rem;
            color: var(--pink);
            font-weight: 400;
            margin: 2rem 0;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--pink);
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                font-size: 1rem;
                padding: 0.7rem 2rem;
            }

            .btn-no {
                font-size: 0.8rem;
                padding: 0.4rem 1.2rem;
            }

            .message {
                font-size: 1.1rem;
            }

            .celebration-message {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Overlay to prevent clicks during delay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main container -->
    <div class="container">
        <div class="content-box" id="mainContent">
            <h1 id="headline">Will you be my Valentine?</h1>
            
            <!-- Media container for images -->
            <div class="media-container hidden" id="mediaContainer"></div>
            
            <!-- Message container -->
            <div class="message hidden" id="messageText"></div>
            
            <!-- Buttons -->
            <div class="button-container" id="buttonContainer">
                <button class="btn btn-yes" id="yesBtn">Yes</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>

        <!-- Celebration content (hidden initially) -->
        <div class="celebration" id="celebration">
            <div class="content-box">
                <div class="media-container" id="celebrationMedia"></div>
                <div class="celebration-message" id="celebrationMessage">
                    Hell fucking yea lets go, see you then!
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti container -->
    <div id="confettiContainer"></div>

    <script>
        // Configuration
        const CONFIG = {
            firstNoImage: 'first-no-image.png',
            celebrationImage: 'celebration-image.png',
            celebrationMessage: "Hell fucking yea lets go, see you then!",
            firstNoHeading: "No is not an option.",
            secondNoMessage: "I said no is not an option.",
            confirmationMessage: "Congratulations on your decision! Our reservation is February 20th at 6:45 pm at Sage and Salt Bistro. - Love, Quinn",
            phoneNumber: '+16096085401',
            netlifyFunctionUrl: '/.netlify/functions/send-sms',
            imageDisplayTime: 5000 // 5 seconds
        };

        // State management
        let noClickCount = 0;
        let evasiveMode = false;
        let isDelaying = false;

        // DOM elements
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContent = document.getElementById('mainContent');
        const celebration = document.getElementById('celebration');
        const mediaContainer = document.getElementById('mediaContainer');
        const messageText = document.getElementById('messageText');
        const celebrationMedia = document.getElementById('celebrationMedia');
        const celebrationMessage = document.getElementById('celebrationMessage');
        const buttonContainer = document.getElementById('buttonContainer');
        const headline = document.getElementById('headline');
        const overlay = document.getElementById('overlay');

        // Show media (image)
        function showMedia(src) {
            mediaContainer.innerHTML = '';
            const mediaElement = document.createElement('img');
            mediaElement.src = src;
            mediaElement.alt = 'Image';
            mediaContainer.appendChild(mediaElement);
            mediaContainer.classList.remove('hidden');
        }

        // Show message
        function showMessage(text) {
            messageText.textContent = text;
            messageText.classList.remove('hidden');
        }

        // Create overlay to block clicks
        function showOverlay() {
            overlay.classList.add('active');
        }

        function hideOverlay() {
            overlay.classList.remove('active');
        }

        // Make button evasive with smooth movement
        function makeButtonEvasive() {
            evasiveMode = true;
            noBtn.classList.add('evasive');
            
            function moveButton() {
                if (!evasiveMode) return;

                const containerRect = buttonContainer.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();
                
                const maxX = window.innerWidth - btnRect.width - 40;
                const maxY = window.innerHeight - btnRect.height - 40;
                
                const newX = Math.random() * maxX + 20;
                const newY = Math.random() * maxY + 20;
                
                noBtn.style.left = newX + 'px';
                noBtn.style.top = newY + 'px';
            }
            
            // Initial position
            moveButton();
            
            // Move on hover/touch with smooth transition
            noBtn.addEventListener('mouseenter', moveButton);
            noBtn.addEventListener('mousemove', moveButton);
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveButton();
            });
        }

        // Create confetti
        function createConfetti() {
            const colors = ['#FF6B9D', '#FFC1E3', '#FF4757', '#FFD93D', '#6BCF7F'];
            const confettiContainer = document.getElementById('confettiContainer');
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confettiContainer.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Send SMS notification
        async function sendSMS() {
            try {
                const response = await fetch(CONFIG.netlifyFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: CONFIG.phoneNumber,
                        message: CONFIG.confirmationMessage
                    })
                });
                
                if (!response.ok) {
                    console.error('Failed to send SMS notification');
                }
            } catch (error) {
                console.error('Error sending SMS:', error);
            }
        }

        // Handle "Yes" button click
        function handleYes() {
            // Hide main content
            mainContent.classList.add('hidden');
            
            // Show celebration
            celebration.classList.add('active');
            celebrationMessage.textContent = CONFIG.celebrationMessage;
            
            // Show celebration image
            const img = document.createElement('img');
            img.src = CONFIG.celebrationImage;
            img.alt = 'Celebration';
            celebrationMedia.appendChild(img);
            
            // Create confetti
            createConfetti();
            
            // Send SMS notification
            sendSMS();
        }

        // Handle "No" button click
        function handleNo() {
            if (isDelaying || evasiveMode) return;
            
            noClickCount++;
            
            if (noClickCount === 1) {
                // First "No" - show image, change heading, and force 5 second delay
                isDelaying = true;
                noBtn.classList.add('disabled');
                showOverlay();
                
                showMedia(CONFIG.firstNoImage);
                headline.textContent = CONFIG.firstNoHeading;
                
                // After 5 seconds, enable button and make it evasive
                setTimeout(() => {
                    noBtn.classList.remove('disabled');
                    hideOverlay();
                    isDelaying = false;
                    makeButtonEvasive();
                }, CONFIG.imageDisplayTime);
                
            } else if (noClickCount === 2) {
                // Second "No" - just show warning message (button already evasive)
                showMessage(CONFIG.secondNoMessage);
            }
        }

        // Event listeners
        yesBtn.addEventListener('click', handleYes);
        noBtn.addEventListener('click', handleNo);
    </script>
</body>
</html>
