<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-pink: #FF6B9D;
            --secondary-pink: #FFC1E3;
            --accent-red: #FF4757;
            --soft-cream: #FFF5F7;
            --text-dark: #2C0E37;
            --dark-bg: #0a0a0a;
            --dark-secondary: #1a1a1a;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a0a0f 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 107, 157, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: float-up 8s ease-in infinite;
            opacity: 0.4;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.4;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .content-box {
            background: rgba(26, 26, 26, 0.95);
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.3), 0 0 100px rgba(255, 107, 157, 0.1);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 107, 157, 0.3);
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: var(--primary-pink);
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .media-container {
            margin: 2rem 0;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-container img,
        .media-container video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .message {
            font-size: 1.5rem;
            color: var(--accent-red);
            font-weight: 700;
            margin: 2rem 0;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .button-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 1.2rem 3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #FF6B9D, #FF4757);
            color: white;
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
        }

        .btn-yes:active {
            transform: translateY(-1px) scale(1.03);
        }

        .btn-no {
            background: linear-gradient(135deg, #E0E0E0, #BDBDBD);
            color: #666;
            position: relative;
            transition: all 0.2s ease;
        }

        .btn-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-no.evasive {
            position: absolute;
        }

        /* Celebration styles */
        .celebration {
            display: none;
        }

        .celebration.active {
            display: block;
        }

        .celebration-message {
            font-size: 2.5rem;
            color: var(--primary-pink);
            font-weight: 700;
            margin: 2rem 0;
            animation: celebration-bounce 1s ease-in-out infinite;
        }

        @keyframes celebration-bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--primary-pink);
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                font-size: 1.2rem;
                padding: 1rem 2rem;
            }

            .message {
                font-size: 1.2rem;
            }

            .celebration-message {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- Main container -->
    <div class="container">
        <div class="content-box" id="mainContent">
            <h1 id="headline">Will You Be My Valentine?</h1>
            
            <!-- Media container for images/videos -->
            <div class="media-container hidden" id="mediaContainer"></div>
            
            <!-- Message container -->
            <div class="message hidden" id="messageText"></div>
            
            <!-- Buttons -->
            <div class="button-container" id="buttonContainer">
                <button class="btn btn-yes" id="yesBtn">Yes! 💕</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>

        <!-- Celebration content (hidden initially) -->
        <div class="celebration" id="celebration">
            <div class="content-box">
                <h1>🎉 Yay! 🎉</h1>
                <div class="media-container" id="celebrationMedia"></div>
                <div class="celebration-message" id="celebrationMessage">
                    We're going to have the best Valentine's Day ever! 💕
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti container -->
    <div id="confettiContainer"></div>

    <!-- Audio for celebration -->
    <audio id="celebrationAudio" preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Configuration - easily customizable
        const CONFIG = {
            firstNoImage: 'first-no-image.png', // Custom uploaded image
            celebrationImage: 'https://media.giphy.com/media/g9582DNuQppxC/giphy.gif', // Happy celebration
            celebrationMessage: "We're going to have the best Valentine's Day ever! 💕",
            firstNoMessage: "Noooooo, Wrong, try again",
            secondNoMessage: "Choose again wisely or there will be issues",
            confirmationMessage: "Congratulations on your decision! Our reservation is February 20th at 6:45 pm at Sage and Salt Bistro. - Love, Quinn",
            phoneNumber: '+16096085401',
            netlifyFunctionUrl: '/.netlify/functions/send-sms' // Netlify function endpoint
        };

        // State management
        let noClickCount = 0;
        let evasiveMode = false;

        // DOM elements
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContent = document.getElementById('mainContent');
        const celebration = document.getElementById('celebration');
        const mediaContainer = document.getElementById('mediaContainer');
        const messageText = document.getElementById('messageText');
        const celebrationMedia = document.getElementById('celebrationMedia');
        const celebrationMessage = document.getElementById('celebrationMessage');
        const celebrationAudio = document.getElementById('celebrationAudio');
        const buttonContainer = document.getElementById('buttonContainer');
        const headline = document.getElementById('headline');

        // Initialize floating hearts
        function createFloatingHearts() {
            const heartsBg = document.getElementById('heartsBg');
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                heartsBg.appendChild(heart);

                setTimeout(() => heart.remove(), 8000);
            }, 500);
        }

        // Show media (image or video)
        function showMedia(type, src) {
            mediaContainer.innerHTML = '';
            let mediaElement;
            
            if (type === 'image') {
                mediaElement = document.createElement('img');
                mediaElement.src = src;
                mediaElement.alt = 'Reaction';
            } else if (type === 'video') {
                mediaElement = document.createElement('video');
                mediaElement.src = src;
                mediaElement.autoplay = true;
                mediaElement.loop = true;
                mediaElement.muted = true;
                mediaElement.controls = false;
            }
            
            if (mediaElement) {
                mediaContainer.appendChild(mediaElement);
                mediaContainer.classList.remove('hidden');
            }
        }

        // Show message
        function showMessage(text) {
            messageText.textContent = text;
            messageText.classList.remove('hidden');
            // Retrigger animation
            messageText.style.animation = 'none';
            setTimeout(() => {
                messageText.style.animation = 'shake 0.5s ease-in-out';
            }, 10);
        }

        // Reset to initial state
        function resetToInitial() {
            setTimeout(() => {
                mediaContainer.classList.add('hidden');
                messageText.classList.add('hidden');
                headline.textContent = 'Will You Be My Valentine?';
            }, 3000);
        }

        // Make button evasive
        function makeButtonEvasive() {
            evasiveMode = true;
            noBtn.classList.add('evasive');
            
            // Position button in a random location
            function moveButton() {
                const containerRect = buttonContainer.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();
                
                const maxX = window.innerWidth - btnRect.width - 40;
                const maxY = window.innerHeight - btnRect.height - 40;
                
                const newX = Math.random() * maxX + 20;
                const newY = Math.random() * maxY + 20;
                
                noBtn.style.left = newX + 'px';
                noBtn.style.top = newY + 'px';
            }
            
            moveButton();
            
            // Move on hover/touch
            noBtn.addEventListener('mouseenter', moveButton);
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveButton();
            });
        }

        // Create confetti
        function createConfetti() {
            const colors = ['#FF6B9D', '#FFC1E3', '#FF4757', '#FFD93D', '#6BCF7F'];
            const confettiContainer = document.getElementById('confettiContainer');
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confettiContainer.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Send SMS notification
        async function sendSMS() {
            try {
                const response = await fetch(CONFIG.netlifyFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to: CONFIG.phoneNumber,
                        message: CONFIG.confirmationMessage
                    })
                });
                
                if (!response.ok) {
                    console.error('Failed to send SMS notification');
                }
            } catch (error) {
                console.error('Error sending SMS:', error);
            }
        }

        // Handle "Yes" button click
        function handleYes() {
            // Hide main content
            mainContent.classList.add('hidden');
            
            // Show celebration
            celebration.classList.add('active');
            celebrationMessage.textContent = CONFIG.celebrationMessage;
            
            // Show celebration image
            const img = document.createElement('img');
            img.src = CONFIG.celebrationImage;
            img.alt = 'Celebration';
            celebrationMedia.appendChild(img);
            
            // Create confetti
            createConfetti();
            
            // Play celebration music
            celebrationAudio.play().catch(err => {
                console.log('Audio autoplay prevented:', err);
                // Try playing after user interaction
                document.addEventListener('click', () => {
                    celebrationAudio.play();
                }, { once: true });
            });
            
            // Send SMS notification
            sendSMS();
        }

        // Handle "No" button click
        function handleNo() {
            noClickCount++;
            
            if (noClickCount === 1) {
                // First "No" - show image
                showMedia('image', CONFIG.firstNoImage);
                showMessage(CONFIG.firstNoMessage);
                resetToInitial();
            } else if (noClickCount === 2) {
                // Second "No" - warning message and make button evasive
                mediaContainer.classList.add('hidden');
                showMessage(CONFIG.secondNoMessage);
                setTimeout(() => {
                    messageText.classList.add('hidden');
                    headline.textContent = 'Will You Be My Valentine?';
                    makeButtonEvasive();
                }, 3000);
            }
            // After second click, button is evasive and can't be clicked
        }

        // Event listeners
        yesBtn.addEventListener('click', handleYes);
        noBtn.addEventListener('click', handleNo);

        // Initialize
        createFloatingHearts();

        // Use a better celebration song if available
        // You can replace the audio source with Kool & The Gang's "Celebration"
        // For demo purposes, using a placeholder
    </script>
</body>
</html>
