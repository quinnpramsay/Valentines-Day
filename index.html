<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #FF6B9D;
            --black: #000000;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .content-box {
            padding: 3rem 2rem;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            color: var(--pink);
            margin-bottom: 3rem;
            font-weight: 400;
        }

        .media-container {
            margin: 2rem auto;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 500px;
        }

        .media-container img {
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
        }

        .message {
            font-size: 1.3rem;
            color: var(--pink);
            font-weight: 400;
            margin: 2rem 0;
        }

        .button-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 3rem;
            flex-wrap: wrap;
            position: relative;
            min-height: 60px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 0.8rem 2.5rem;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
        }

        .btn-yes {
            border-color: var(--pink);
            color: var(--pink);
        }

        .btn-yes:hover {
            background: var(--pink);
            color: var(--black);
        }

        .btn-no {
            border-color: var(--pink);
            color: var(--pink);
            font-size: 0.9rem;
            padding: 0.5rem 1.5rem;
            position: relative;
        }

        .btn-no:hover {
            background: var(--pink);
            color: var(--black);
        }

        .btn-try-again {
            border-color: var(--pink);
            color: var(--pink);
            margin-top: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-try-again:hover {
            background: var(--pink);
            color: var(--black);
        }

        .btn-no.evasive {
            position: fixed;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-no.evasive:hover {
            transform: scale(1.1);
        }

        .btn-no.disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        /* Celebration styles */
        .celebration {
            display: none;
        }

        .celebration.active {
            display: block;
        }

        .celebration-message {
            font-size: 1.5rem;
            color: var(--pink);
            font-weight: 400;
            margin: 2rem 0;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--pink);
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                font-size: 1rem;
                padding: 0.7rem 2rem;
            }

            .btn-no {
                font-size: 0.8rem;
                padding: 0.4rem 1.2rem;
            }

            .message {
                font-size: 1.1rem;
            }

            .celebration-message {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <div class="container">
        <div class="content-box" id="mainContent">
            <h1 id="headline">Will you be my Valentine?</h1>
            
            <!-- Media container for images -->
            <div class="media-container hidden" id="mediaContainer"></div>
            
            <!-- Try Again button (shown on first No screen) -->
            <button class="btn btn-try-again hidden" id="tryAgainBtn">Try Again</button>
            
            <!-- Message container -->
            <div class="message hidden" id="messageText"></div>
            
            <!-- Buttons -->
            <div class="button-container" id="buttonContainer">
                <button class="btn btn-yes" id="yesBtn">Yes</button>
                <button class="btn btn-no" id="noBtn">No</button>
                <button class="btn btn-try-again hidden" id="tryAgainBtn">Try Again</button>
            </div>
        </div>

        <!-- Celebration content (hidden initially) -->
        <div class="celebration" id="celebration">
            <div class="content-box">
                <div class="media-container" id="celebrationMedia"></div>
                <div class="celebration-message" id="celebrationMessage">
                    Hell fucking yea lets go, see you then!
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti container -->
    <div id="confettiContainer"></div>

    <script>
        // Configuration
        const CONFIG = {
            firstNoImage: 'first-no-image.png',
            celebrationImage: 'celebration-image.png',
            celebrationMessage: "Hell fucking yea lets go, see you then!",
            firstNoHeading: "No is not an option.",
            secondNoMessage: "I said no is not an option."
        };

        // State management
        let noClickCount = 0;
        let evasiveMode = false;

        // DOM elements
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const tryAgainBtn = document.getElementById('tryAgainBtn');
        const mainContent = document.getElementById('mainContent');
        const celebration = document.getElementById('celebration');
        const mediaContainer = document.getElementById('mediaContainer');
        const messageText = document.getElementById('messageText');
        const celebrationMedia = document.getElementById('celebrationMedia');
        const celebrationMessage = document.getElementById('celebrationMessage');
        const buttonContainer = document.getElementById('buttonContainer');
        const headline = document.getElementById('headline');

        // Show media (image)
        function showMedia(src) {
            mediaContainer.innerHTML = '';
            const mediaElement = document.createElement('img');
            mediaElement.src = src;
            mediaElement.alt = 'Image';
            mediaContainer.appendChild(mediaElement);
            mediaContainer.classList.remove('hidden');
        }

        // Show message
        function showMessage(text) {
            messageText.textContent = text;
            messageText.classList.remove('hidden');
        }

        // Make button evasive with smooth, natural movement
        function makeButtonEvasive() {
            evasiveMode = true;
            noBtn.classList.add('evasive');
            
            let moveTimeout;
            
            function moveButton() {
                if (!evasiveMode) return;

                const btnRect = noBtn.getBoundingClientRect();
                const padding = 30;
                
                // Calculate safe boundaries
                const maxX = window.innerWidth - btnRect.width - padding;
                const maxY = window.innerHeight - btnRect.height - padding;
                
                // Generate new position away from edges
                const newX = Math.random() * (maxX - padding * 2) + padding;
                const newY = Math.random() * (maxY - padding * 2) + padding;
                
                // Apply smooth transition
                noBtn.style.transition = 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                noBtn.style.left = newX + 'px';
                noBtn.style.top = newY + 'px';
            }
            
            // Initial position
            moveButton();
            
            // Move on hover - smoother with debouncing
            const debouncedMove = () => {
                clearTimeout(moveTimeout);
                moveTimeout = setTimeout(moveButton, 50);
            };
            
            noBtn.addEventListener('mouseenter', moveButton);
            noBtn.addEventListener('mousemove', debouncedMove);
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveButton();
            });
            noBtn.addEventListener('touchmove', (e) => {
                e.preventDefault();
                debouncedMove();
            });
            
            // Also move periodically for more playful behavior
            setInterval(() => {
                if (evasiveMode && Math.random() > 0.7) {
                    moveButton();
                }
            }, 2000);
        }

        // Create confetti
        function createConfetti() {
            const colors = ['#FF6B9D', '#FFC1E3', '#FF4757', '#FFD93D', '#6BCF7F'];
            const confettiContainer = document.getElementById('confettiContainer');
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confettiContainer.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Handle "Yes" button click
        function handleYes() {
            // Hide main content
            mainContent.classList.add('hidden');
            
            // Show celebration
            celebration.classList.add('active');
            celebrationMessage.textContent = CONFIG.celebrationMessage;
            
            // Show celebration image
            const img = document.createElement('img');
            img.src = CONFIG.celebrationImage;
            img.alt = 'Celebration';
            celebrationMedia.appendChild(img);
            
            // Create confetti
            createConfetti();
        }

        // Handle "No" button click
        function handleNo() {
            if (evasiveMode) return;
            
            noClickCount++;
            
            if (noClickCount === 1) {
                // First "No" - show image, change heading, show Try Again button
                showMedia(CONFIG.firstNoImage);
                headline.textContent = CONFIG.firstNoHeading;
                
                // Hide No and Yes buttons
                buttonContainer.classList.add('hidden');
                
                // Show Try Again button
                tryAgainBtn.classList.remove('hidden');
                
            } else if (noClickCount === 2) {
                // Second "No" - just show rejection message (button still clickable)
                showMessage(CONFIG.secondNoMessage);
                
                // Clear message after 2 seconds
                setTimeout(() => {
                    messageText.classList.add('hidden');
                }, 2000);
                
            } else if (noClickCount === 3) {
                // Third "No" - make button evasive
                makeButtonEvasive();
            }
        }

        // Handle "Try Again" button click
        function handleTryAgain() {
            // Reset heading to original question
            headline.textContent = 'Will you be my Valentine?';
            
            // Hide image and Try Again button
            mediaContainer.classList.add('hidden');
            tryAgainBtn.classList.add('hidden');
            
            // Show button container (button NOT evasive yet)
            buttonContainer.classList.remove('hidden');
        }

        // Event listeners
        yesBtn.addEventListener('click', handleYes);
        noBtn.addEventListener('click', handleNo);
        tryAgainBtn.addEventListener('click', handleTryAgain);
    </script>
</body>
</html>
